<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents Holding · Jira-driven AI staff</title>
<style>
  :root {
    --bg: #070b0a;
    --stage: #101614;
    --ink: #f4f0e6;
    --dim: #9aa398;
    --mute: #6d756c;
    --green: #c6f26d;
    --amber: #e7a15a;
    --line: rgba(244,240,230,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body { font-family: "Avenir Next", "Segoe UI", sans-serif; overflow: hidden; }
  .stage {
    position: absolute;
    left: 50%; top: 50%;
    width: 1600px; height: 900px;
    transform: translate(-50%, -50%) scale(var(--s, 1));
    background: var(--stage);
    overflow: hidden;
  }
  .stage::before {
    content: "";
    position: absolute; left: 0; top: 0; height: 8px; width: var(--p, 0%);
    background: var(--green); z-index: 2;
  }
  .slide { display: none; height: 100%; padding: 72px 88px 88px; position: relative; }
  .slide.on { display: block; }
  .kicker {
    font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    font-size: 18px; letter-spacing: .18em; color: var(--green); margin: 0 0 28px;
  }
  h1 {
    font-family: Georgia, "Iowan Old Style", serif;
    font-weight: 400; font-size: 108px; line-height: .95; margin: 0; letter-spacing: -1px;
  }
  h2 {
    font-family: Georgia, "Iowan Old Style", serif;
    font-weight: 400; font-size: 64px; line-height: 1.05; margin: 0 0 36px; max-width: 1300px;
  }
  .lead { font-size: 34px; line-height: 1.35; max-width: 1100px; margin: 36px 0 0; color: var(--ink); }
  .dim { color: var(--dim); }
  .mono { font-family: ui-monospace, Consolas, monospace; }
  .footer {
    position: absolute; left: 88px; right: 88px; bottom: 36px;
    display: flex; justify-content: space-between;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 16px; letter-spacing: .08em; color: var(--mute);
  }
  .rule { height: 1px; background: var(--line); margin: 28px 0; }
  .cols { display: grid; gap: 28px; }
  .c3 { grid-template-columns: 1fr 1fr 1fr; }
  .c2 { grid-template-columns: 1fr 1fr; }
  .block h3 { margin: 0 0 12px; font-size: 28px; font-weight: 600; }
  .block p { margin: 0; font-size: 24px; line-height: 1.4; color: var(--dim); }
  .idx { font-family: Georgia, serif; font-size: 42px; color: var(--green); display: block; margin-bottom: 12px; }
  .stat { font-family: Georgia, serif; font-size: 92px; line-height: .9; margin: 0; }
  .bench { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 64px; margin-top: 56px; }
  .bench-k { margin: 28px 0 0; font-size: 22px; letter-spacing: .16em; text-transform: uppercase; color: var(--green); }
  .bench-n { margin: 14px 0 0; font-family: Georgia, serif; font-size: 44px; line-height: 1.1; color: var(--ink); }
  .bench-vs { margin: 8px 0 0; font-size: 32px; line-height: 1.25; color: var(--ink); }
  table { width: 100%; border-collapse: collapse; font-size: 28px; }
  th { text-align: left; font-weight: 500; color: var(--mute); font-size: 16px; letter-spacing: .14em; padding: 0 0 16px; }
  td { padding: 18px 16px 18px 0; border-top: 1px solid var(--line); vertical-align: baseline; }
  td.n { font-family: Georgia, serif; font-size: 34px; }
  td.win { color: var(--green); }
  .cmd {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 26px; color: var(--green); margin: 0 0 8px;
  }
  .launch { margin: 0 0 22px; }
  .launch .cmd { font-size: 30px; margin: 0 0 6px; }
  .launch p { margin: 0; font-size: 26px; color: var(--ink); }
  .term {
    margin-top: 18px; background: #07110e; border: 1px solid #2c3a32; border-radius: 12px;
    overflow: hidden; font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .term-bar {
    display: flex; gap: 8px; align-items: center; padding: 12px 16px;
    background: #121c18; color: var(--mute); font-size: 16px;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .term-body { padding: 18px 22px 22px; font-size: 22px; line-height: 1.45; }
  .term-body .ps { color: var(--green); }
  .term-body .dimline { color: var(--dim); }
  .pick { color: var(--ink); }
  .pick.on { background: #e8f5d8; color: #10210c; display: block; margin: 0 -8px; padding: 0 8px; }
  .path { font-family: ui-monospace, Consolas, monospace; font-size: 26px; color: var(--green); }
  .rowline { display: grid; grid-template-columns: 340px 1fr; gap: 24px; padding: 16px 0; border-top: 1px solid var(--line); font-size: 26px; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; margin-top: 20px; }
  .step { border-top: 3px solid var(--green); padding-top: 18px; }
  .step b { display: block; font-size: 26px; margin-bottom: 10px; }
  .step span { color: var(--dim); font-size: 22px; line-height: 1.35; display: block; }
  .giant { font-family: Georgia, serif; font-size: 78px; line-height: 1.05; margin: 80px 0 0; }
  .agenda { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 56px; margin-top: 28px; }
  .agenda div { border-top: 2px solid var(--green); padding-top: 12px; }
  .agenda b { display: block; font-size: 28px; font-weight: 600; margin-bottom: 4px; }
  .agenda span { display: block; font-size: 22px; color: var(--dim); }
  .note { position: absolute; left: 88px; right: 88px; bottom: 86px; color: var(--mute); font-size: 20px; }
  body.all { overflow: auto; height: auto; }
  body.all .stage { position: static; transform: none; margin: 0 auto 24px; height: auto; background: none; overflow: visible; }
  body.all .stage::before { display: none; }
  body.all .slide { display: block; height: 900px; background: var(--stage); margin-bottom: 24px; }
  #lang { position: fixed; top: 14px; right: 14px; z-index: 10; display: flex; gap: 4px; font-family: ui-monospace, Consolas, monospace; }
  #lang button { background: rgba(16,22,20,.85); color: var(--dim); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  #lang button.on { color: #10210c; background: var(--green); border-color: var(--green); }
</style>
</head>
<body>
<div id="lang"><button data-l="en">EN</button><button data-l="vi">VI</button></div>
<div class="stage" id="stage"></div>
<script>
const slides = [
  () => `
    <p class="kicker">AGENTS HOLDING  ·  JIRA-DRIVEN AI STAFF  ·  NOVEMBER 2026</p>
    <h1>A company of agents<br>for every product.</h1>
    <p class="lead">Drag a Jira card. Your local AI agent plans, codes, tests and reports back, and a hosted MCP server keeps the workflow honest.</p>
    <div class="agenda" style="margin-top:56px">
      <div><b>01  Architecture</b><span>A hosted MCP server plus a local AI agent.</span></div>
      <div><b>02  Keys and credits</b><span>Generate or import a key, plans, credits per action.</span></div>
      <div><b>03  The Jira flow</b><span>Gates, custom flows, per-task flow types, /task add, /task split, /company set auto-pr.</span></div>
      <div><b>04  Setup and tokens</b><span>/jira setup, the Keychain, the listener, /doctor, and measured savings.</span></div>
    </div>
    <p class="footer"><span>AGENTS HOLDING</span><span>01</span></p>`,
  () => `
    <p class="kicker">01  /  ARCHITECTURE</p>
    <h2>The server owns the rules. Your Mac does the work.</h2>
    <div class="cols c3" style="margin-top:24px">
      <div class="block"><span class="idx">Server</span><h3>MCP server</h3><p>Hosted for you. It holds the rules, slash commands, flows and license checks, and keeps each company's data isolated per license.</p></div>
      <div class="block"><span class="idx">Mac</span><h3>Local AI agent</h3><p>The Jira Listener receives notices and runs your agent CLI in your repo. Git, Jira reads, comments and card moves are scripts. The model only writes plans and code, and returns structured JSON.</p></div>
      <div class="block"><span class="idx">Jira</span><h3>Your board is the UI</h3><p>You drag cards and comment. Agents answer as <span class="mono">[agents-holding]</span> comments and move the card when a stage is done.</p></div>
    </div>
    <p class="note">Your code never leaves your machine. The server only sees titles, artifacts and token counts.</p>
    <p class="footer"><span>ARCHITECTURE</span><span>02</span></p>`,
  () => `
    <p class="kicker">02  /  KEYS</p>
    <h2>One key per machine. Two ways to get it.</h2>
    <div class="steps">
      <div class="step"><b>1  Generate key</b><span><span class="mono">holding key generate</span>, or the Generate key button on the setup page. You get a Free key (1,500 credits a month), stored in this Mac's Keychain and never shown.</span></div>
      <div class="step"><b>2  Import key</b><span><span class="mono">holding key import</span> asks for a key you already have (paid, or from another Mac) at a hidden prompt. Each extra Mac counts against the key's machine limit.</span></div>
      <div class="step"><b>3  Lost it on this Mac?</b><span>Run Generate key again: it recovers this machine's key with the same credits and history, under a new secret. The old one stops working.</span></div>
      <div class="step"><b>4  Check it</b><span><span class="mono">holding key show</span> shows the key id, plan, credits and machines. Send the key id (never the key) to the owner to upgrade or add credits.</span></div>
    </div>
    <p class="note">One Free key per machine, ever. Keys stay in the Keychain and never pass through the chat.</p>
    <p class="footer"><span>KEYS</span><span>03</span></p>`,
  () => `
    <p class="kicker">02  /  CREDITS</p>
    <h2>You pay per action, not per token.</h2>
    <style>.cr td,.cr th{padding:5px 0!important;font-size:20px!important}.cr th{font-size:13px!important}</style><table class="cr">
      <thead><tr><th>PLAN</th><th>CREDITS / MONTH</th><th>PLAN</th><th>CREDITS / MONTH</th></tr></thead>

        <tr><td>Free</td><td class="n">1,500</td><td>Power</td><td class="n">80,000</td></tr>

      </tbody>
    </table>
    <div class="steps" style="margin-top:14px">
      <div class="step"><b>1  What costs</b><span>next action 2 credits; advance, Jira updates, staff brief, artifact, assign, CEO and inbox posts or replies 1 each. Everything else is free, and model tokens never count.</span></div>
      <div class="step"><b>2  When credits run out</b><span>The Jira Listener stops and says so. Jira changes made meanwhile are not replayed; after renewal each open card's current state is reconciled.</span></div>
      <div class="step"><b>3  Extra credits</b><span>Per period, until renewal (held 90 days at most), or until used up (they survive expiry but only work while the key is active).</span></div>
    </div>

    <p class="footer"><span>CREDITS</span><span>04</span></p>`,

      <div class="block"><h3>Done is yours</h3><p>Only you move a card to Done. The agent posts a closing comment by script, with no model call.</p></div>
    </div>
    <p class="footer"><span>JIRA FLOW</span><span>05</span></p>`,

    <p class="kicker" style="margin-bottom:16px">05  /  RESILIENCE  ·  WHEN THINGS FAIL</p>
    <h2 style="font-size:46px;margin:0 0 22px">When things fail, work pauses. It is never lost.</h2>
    <div class="cols" style="grid-template-columns:repeat(3,1fr);gap:32px"><div class="block" style="border-top:3px solid #6db3f2;padding-top:14px"><h3 style="font-size:26px;color:#6db3f2;margin-bottom:4px">Agent compaction / crash</h3><p style="font-size:16px;margin-bottom:12px">→ checkpoint &amp; resume</p><div style="font-size:17px;line-height:1.35;color:var(--ink)"><div style="margin-bottom:8px"><b style="display:inline-block;width:20px;height:20px;border-radius:50%;background:#f4f0e6;color:#10210c;text-align:center;font-size:13px;line-height:20px;margin-right:6px">1</b>Every stage writes a local checkpoint.</div><div style="margin-bottom:8px"><b style="display:inline-block;width:20px;height:20px;border-radius:50%;background:#f4f0e6;color:#10210c;text-align:center;font-size:13px;line-height:20px;margin-right:6px">2</b>Big coding work is split into sub-steps, each WIP-committed, with a progress note on the card.</div><div style="margin-bottom:8px"><b style="display:inline-block;width:20px;height:20px;border-radius:50%;background:#f4f0e6;color:#10210c;text-align:center;font-size:13px;line-height:20px;margin-right:6px">3</b>A rerun resumes from the last checkpoint instead of restarting.</div><div style="margin-bottom:8px"><b style="display:inline-block;width:20px;height:20px;border-radius:50%;background:#f4f0e6;color:#10210c;text-align:center;font-size:13px;line-height:20px;margin-right:6px">4</b>Compaction or context overflow triggers one fresh retry with a resume note.</div></div></div><div class="block" style="border-top:3px solid #e7a15a;padding-top:14px"><h3 style="font-size:26px;color:#e7a15a;margin-bottom:4px">Agent expired / blocked</h3><p style="font-size:16px;margin-bottom:12px">→ fallback</p><div style="font-size:17px;line-height:1.35;color:var(--ink)"><div style="margin-bottom:8px"><b style="display:inline-block;width:20px;height:20px;border-radius:50%;background:#f4f0e6;color:#10210c;text-align:center;font-size:13px;line-height:20px;margin-right:6px">1</b>CLI errors are classified: login expired, out of quota, rate limited, CLI missing.</div><div style="margin-bottom:8px"><b style="display:inline-block;width:20px;height:20px;border-radius:50%;background:#f4f0e6;color:#10210c;text-align:center;font-size:13px;line-height:20px;margin-right:6px">2</b>Rate limits back off 30s → 60s → 120s.</div><div style="margin-bottom:8px"><b style="display:inline-block;width:20px;height:20px;border-radius:50%;background:#f4f0e6;color:#10210c;text-align:center;font-size:13px;line-height:20px;margin-right:6px">3</b>Otherwise the next fallback command in <span class="mono">agents.jsonc</span> takes over, and the card says so.</div><div style="margin-bottom:8px"><b style="display:inline-block;width:20px;height:20px;border-radius:50%;background:#f4f0e6;color:#10210c;text-align:center;font-size:13px;line-height:20px;margin-right:6px">4</b>If nothing works: <span class="mono">agent-blocked</span> label, a comment in the task’s language with the exact fix (e.g. <span class="mono">claude login</span>), and a desktop notification.</div></div></div><div class="block" style="border-top:3px solid #e06a5c;padding-top:14px"><h3 style="font-size:26px;color:#e06a5c;margin-bottom:4px">MCP server problems</h3><p style="font-size:16px;margin-bottom:12px">down · quota · overload · timeout → warn &amp; reconcile</p><div style="font-size:17px;line-height:1.35;color:var(--ink)"><div style="margin-bottom:8px"><b style="display:inline-block;width:20px;height:20px;border-radius:50%;background:#f4f0e6;color:#10210c;text-align:center;font-size:13px;line-height:20px;margin-right:6px">1</b>The Jira Listener shows a red warning and notifies you once.</div><div style="margin-bottom:8px"><b style="display:inline-block;width:20px;height:20px;border-radius:50%;background:#f4f0e6;color:#10210c;text-align:center;font-size:13px;line-height:20px;margin-right:6px">2</b>Work pauses without losing progress.</div><div style="margin-bottom:8px"><b style="display:inline-block;width:20px;height:20px;border-radius:50%;background:#f4f0e6;color:#10210c;text-align:center;font-size:13px;line-height:20px;margin-right:6px">3</b>On recovery it reads Jira for issues changed since the last event and replays each real status once, deduped, never inventing events.</div><div style="margin-bottom:8px"><b style="display:inline-block;width:20px;height:20px;border-radius:50%;background:#f4f0e6;color:#10210c;text-align:center;font-size:13px;line-height:20px;margin-right:6px">4</b>Read-only commands show cached data marked <span class="mono">STALE</span>; quota errors show a clear message.</div></div></div></div>

argin-right:6px">1</b>Lỗi CLI được phân loại: hết phiên đăng nhập, hết quota, bị rate limit, chưa cài CLI.</div><div style="margin-bottom:8px"><b style="display:inline-block;width:20px;height:20px;border-radius:50%;background:#f4f0e6;color:#10210c;text-align:center;font-size:13px;line-height:20px;margin-right:6px">2</b>Bị rate limit thì chờ 30s → 60s → 120s rồi thử lại.</div><div style="margin-bottom:8px"><b style="display:inline-block;width:20px;height:20px;border-radius:50%;background:#f4f0e6;color:#10210c;text-align:center;font-size:13px;line-height:20px;margin-right:6px">3</b>Lỗi khác thì lệnh dự phòng kế tiếp trong <span class="mono">agents.jsonc</span> làm thay, và thẻ có ghi rõ.</div><div style="margin-bottom:8px"><b style="display:inline-block;width:20px;height:20px;border-radius:50%;background:#f4f0e6;color:#10210c;text-align:center;font-size:13px;line-height:20px;margin-right:6px">4</b>Hết cách thì thẻ được gắn nhãn <span class="mono">agent-blocked</span>, có comment bằng ngôn ngữ của task chỉ đúng cách sửa (vd. <span class="mono">claude login</span>), và báo lên desktop.</div></div></div><div class="block" style="border-top:3px solid #e06a5c;padding-top:14px"><h3 style="font-size:26px;color:#e06a5c;margin-bottom:4px">MCP server gặp vấn đề</h3><p style="font-size:16px;margin-bottom:12px">sập · hết quota · quá tải · timeout → cảnh báo rồi đồng bộ lại</p><div style="font-size:17px;line-height:1.35;color:var(--ink)"><div style="margin-bottom:8px"><b style="display:inline-block;width:20px;height:20px;border-radius:50%;background:#f4f0e6;color:#10210c;text-align:center;font-size:13px;line-height:20px;margin-right:6px">1</b>Jira Listener hiện cảnh báo đỏ và báo bạn một lần thôi.</div><div style="margin-bottom:8px"><b style="display:inline-block;width:20px;height:20px;border-radius:50%;background:#f4f0e6;color:#10210c;text-align:center;font-size:13px;line-height:20px;margin-right:6px">2</b>Việc tạm dừng, tiến độ vẫn giữ nguyên.</div><div style="margin-bottom:8px"><b style="display:inline-block;width:20px;height:20px;border-radius:50%;background:#f4f0e6;color:#10210c;text-align:center;font-size:13px;line-height:20px;margin-right:6px">3</b>Khi ổn lại, nó đọc Jira xem issue nào đổi từ lần cuối, phát lại mỗi trạng thái thật đúng một lần, không trùng, không tự bịa ra.</div><div style="margin-bottom:8px"><b style="display:inline-block;width:20px;height:20px;border-radius:50%;background:#f4f0e6;color:#10210c;text-align:center;font-size:13px;line-height:20px;margin-right:6px">4</b>Lệnh chỉ đọc thì trả dữ liệu cache có đánh dấu <span class="mono">STALE</span>; hết quota thì báo rõ ràng.</div></div></div></div>

const stage = document.getElementById("stage");
const qlang = new URLSearchParams(location.search).get("lang");
let lang = (qlang === "vi" || qlang === "en") ? qlang : (localStorage.getItem("ah-lang") || "en");
if (qlang === "vi" || qlang === "en") localStorage.setItem("ah-lang", qlang);
let i = 0;
function render() {
  const set = lang === "vi" ? slidesVi : slides;
  stage.innerHTML = "";
  set.forEach((fn) => { const el = document.createElement("section"); el.className = "slide"; el.innerHTML = fn(); stage.appendChild(el); });
  document.documentElement.lang = lang;
  document.title = lang === "vi" ? "Agents Holding · Nhân sự AI điều khiển bằng Jira" : "Agents Holding · Jira-driven AI staff";
  const lb = document.getElementById("lang"); lb.title = lang === "vi" ? "Chọn ngôn ngữ" : "Language"; lb.querySelector("[data-l=en]").title = lang === "vi" ? "Tiếng Anh" : "English"; lb.querySelector("[data-l=vi]").title = lang === "vi" ? "Tiếng Việt" : "Vietnamese";
  document.querySelectorAll("#lang button").forEach((b) => b.classList.toggle("on", b.dataset.l === lang));
}
function setLang(l) {
  lang = l; localStorage.setItem("ah-lang", l);
  const u = new URL(location.href); u.searchParams.set("lang", l); history.replaceState(null, "", u.pathname + u.search + location.hash);
  render();
  if (document.body.classList.contains("all")) [...stage.children].forEach((el) => el.classList.add("on")); else show(i);
}
document.querySelectorAll("#lang button").forEach((b) => b.addEventListener("click", (e) => {
  setLang(b.dataset.l); }));
render();
function fit() {
  const s = Math.min(innerWidth / 1600, innerHeight / 900);
  stage.style.setProperty("--s", String(s));
}
function show(n) {
  i = (n + slides.length) % slides.length;
  [...stage.children].forEach((el, k) => el.classList.toggle("on", k === i));
  stage.style.setProperty("--p", ((i + 1) / slides.length * 100) + "%");
  history.replaceState(null, "", location.pathname + location.search + "#" + (i + 1));
}
addEventListener("resize", fit);
addEventListener("keydown", (e) => {
  if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) { e.preventDefault(); show(i + 1); }
  else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); show(i - 1); }
  else if (e.key === "Home") show(0);
  else if (e.key === "End") show(slides.length - 1);
  else if (e.key === "f") document.documentElement.requestFullscreen?.();
});
addEventListener("click", (e) => {
  if (e.target.closest("#lang")) return;
  if (e.clientX > innerWidth * 0.72) show(i + 1);
  else if (e.clientX < innerWidth * 0.28) show(i - 1);
});
addEventListener("hashchange", () => {
  const n = parseInt(location.hash.slice(1), 10);
  if (Number.isFinite(n)) show(n - 1);
});
if (/all/.test(location.search + location.hash)) { document.body.classList.add("all"); [...stage.children].forEach((el) => el.classList.add("on")); } else {
fit();
const start = parseInt(location.hash.slice(1), 10);
show(Number.isFinite(start) ? start - 1 : 0);
}
