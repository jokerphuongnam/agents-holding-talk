<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents Holding · Jira-driven AI staff</title>
<style>
  :root {
    --bg: #070b0a;
    --stage: #101614;
    --ink: #f4f0e6;
    --dim: #9aa398;
    --mute: #6d756c;
    --green: #c6f26d;
    --amber: #e7a15a;
    --line: rgba(244,240,230,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body { font-family: "Avenir Next", "Segoe UI", sans-serif; overflow: hidden; }
  .stage {
    position: absolute;
    left: 50%; top: 50%;
    width: 1600px; height: 900px;
    transform: translate(-50%, -50%) scale(var(--s, 1));
    background: var(--stage);
    overflow: hidden;
  }
  .stage::before {
    content: "";
    position: absolute; left: 0; top: 0; height: 8px; width: var(--p, 0%);
    background: var(--green); z-index: 2;
  }
  .slide { display: none; height: 100%; padding: 72px 88px 88px; position: relative; }
  .slide.on { display: block; }
  .kicker {
    font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    font-size: 18px; letter-spacing: .18em; color: var(--green); margin: 0 0 28px;
  }
  h1 {
    font-family: Georgia, "Iowan Old Style", serif;
    font-weight: 400; font-size: 108px; line-height: .95; margin: 0; letter-spacing: -1px;
  }
  h2 {
    font-family: Georgia, "Iowan Old Style", serif;
    font-weight: 400; font-size: 64px; line-height: 1.05; margin: 0 0 36px; max-width: 1300px;
  }
  .lead { font-size: 34px; line-height: 1.35; max-width: 1100px; margin: 36px 0 0; color: var(--ink); }
  .dim { color: var(--dim); }
  .mono { font-family: ui-monospace, Consolas, monospace; }
  .footer {
    position: absolute; left: 88px; right: 88px; bottom: 36px;
    display: flex; justify-content: space-between;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 16px; letter-spacing: .08em; color: var(--mute);
  }
  .rule { height: 1px; background: var(--line); margin: 28px 0; }
  .cols { display: grid; gap: 28px; }
  .c3 { grid-template-columns: 1fr 1fr 1fr; }
  .c2 { grid-template-columns: 1fr 1fr; }
  .block h3 { margin: 0 0 12px; font-size: 28px; font-weight: 600; }
  .block p { margin: 0; font-size: 24px; line-height: 1.4; color: var(--dim); }
  .idx { font-family: Georgia, serif; font-size: 42px; color: var(--green); display: block; margin-bottom: 12px; }
  .stat { font-family: Georgia, serif; font-size: 92px; line-height: .9; margin: 0; }
  .bench { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 64px; margin-top: 56px; }
  .bench-k { margin: 28px 0 0; font-size: 22px; letter-spacing: .16em; text-transform: uppercase; color: var(--green); }
  .bench-n { margin: 14px 0 0; font-family: Georgia, serif; font-size: 44px; line-height: 1.1; color: var(--ink); }
  .bench-vs { margin: 8px 0 0; font-size: 32px; line-height: 1.25; color: var(--ink); }
  table { width: 100%; border-collapse: collapse; font-size: 28px; }
  th { text-align: left; font-weight: 500; color: var(--mute); font-size: 16px; letter-spacing: .14em; padding: 0 0 16px; }
  td { padding: 18px 16px 18px 0; border-top: 1px solid var(--line); vertical-align: baseline; }
  td.n { font-family: Georgia, serif; font-size: 34px; }
  td.win { color: var(--green); }
  .cmd {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 26px; color: var(--green); margin: 0 0 8px;
  }
  .launch { margin: 0 0 22px; }
  .launch .cmd { font-size: 30px; margin: 0 0 6px; }
  .launch p { margin: 0; font-size: 26px; color: var(--ink); }
  .term {
    margin-top: 18px; background: #07110e; border: 1px solid #2c3a32; border-radius: 12px;
    overflow: hidden; font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .term-bar {
    display: flex; gap: 8px; align-items: center; padding: 12px 16px;
    background: #121c18; color: var(--mute); font-size: 16px;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .term-body { padding: 18px 22px 22px; font-size: 22px; line-height: 1.45; }
  .term-body .ps { color: var(--green); }
  .term-body .dimline { color: var(--dim); }
  .pick { color: var(--ink); }
  .pick.on { background: #e8f5d8; color: #10210c; display: block; margin: 0 -8px; padding: 0 8px; }
  .path { font-family: ui-monospace, Consolas, monospace; font-size: 26px; color: var(--green); }
  .rowline { display: grid; grid-template-columns: 340px 1fr; gap: 24px; padding: 16px 0; border-top: 1px solid var(--line); font-size: 26px; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; margin-top: 20px; }
  .step { border-top: 3px solid var(--green); padding-top: 18px; }
  .step b { display: block; font-size: 26px; margin-bottom: 10px; }
  .step span { color: var(--dim); font-size: 22px; line-height: 1.35; display: block; }
  .giant { font-family: Georgia, serif; font-size: 78px; line-height: 1.05; margin: 80px 0 0; }
  .agenda { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 56px; margin-top: 28px; }
  .agenda div { border-top: 2px solid var(--green); padding-top: 12px; }
  .agenda b { display: block; font-size: 28px; font-weight: 600; margin-bottom: 4px; }
  .agenda span { display: block; font-size: 22px; color: var(--dim); }
  .note { position: absolute; left: 88px; right: 88px; bottom: 86px; color: var(--mute); font-size: 20px; }
  body.all { overflow: auto; height: auto; }
  body.all .stage { position: static; transform: none; margin: 0 auto 24px; height: auto; background: none; overflow: visible; }
  body.all .stage::before { display: none; }
  body.all .slide { display: block; height: 900px; background: var(--stage); margin-bottom: 24px; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
const slides = [
  () => `
    <p class="kicker">AGENTS HOLDING  ·  JIRA-DRIVEN AI STAFF  ·  NOVEMBER 2026</p>
    <h1>A company of agents<br>for every product.</h1>
    <p class="lead">Drag a Jira card. Your local Grok agent plans, codes, tests and reports back, and a hosted MCP server keeps the workflow honest.</p>
    <div class="agenda" style="margin-top:56px">
      <div><b>01  Architecture</b><span>A hosted MCP server plus a local Grok agent.</span></div>
      <div><b>02  Licenses</b><span>Labels, direct renewals and marketplace keys.</span></div>
      <div><b>03  The Jira flow</b><span>Gates, custom flows, per-task flow types, /new-task, /split, /auto-pr.</span></div>
      <div><b>04  Setup and tokens</b><span>/connect-jira, the Keychain, the listener, /doctor, and measured savings.</span></div>
    </div>
    <p class="footer"><span>AGENTS HOLDING</span><span>01</span></p>`,
  () => `
    <p class="kicker">01  /  ARCHITECTURE</p>
    <h2>The server owns the rules. Your Mac does the work.</h2>
    <div class="cols c3" style="margin-top:24px">
      <div class="block"><span class="idx">Server</span><h3>MCP server</h3><p>Hosted for you. It holds the rules, slash commands, flows and license checks, and keeps each company's data isolated per license.</p></div>
      <div class="block"><span class="idx">Mac</span><h3>Local Grok agent</h3><p>The listener receives notices and runs Grok in your repo. Git, Jira reads, comments and card moves are scripts. The model only writes plans and code, and returns structured JSON.</p></div>
      <div class="block"><span class="idx">Jira</span><h3>Your board is the UI</h3><p>You drag cards and comment. Agents answer as <span class="mono">[agents-holding]</span> comments and move the card when a stage is done.</p></div>
    </div>
    <p class="note">Your code never leaves your machine. The server only sees titles, artifacts and token counts.</p>
    <p class="footer"><span>ARCHITECTURE</span><span>02</span></p>`,
  () => `
    <p class="kicker">02  /  LICENSES</p>
    <h2>One key, many companies. Renewal depends on where it was bought.</h2>
    <div>
      <div class="rowline"><span class="path">License key</span><span>Each request is tied to the key. One key holds many companies, and each repo binds to one company.</span></div>
      <div class="rowline"><span class="path">Label</span><span>The owner labels keys (<span class="mono">/admin licenses label</span>) so every customer and seat is easy to find.</span></div>
      <div class="rowline"><span class="path">Direct key</span><span><span class="mono">/renew</span> gives a ready-made email (<span class="mono">[RENEW] &lt;license id&gt;</span>). The same key keeps working.</span></div>
      <div class="rowline"><span class="path">Marketplace key</span><span>It can't be renewed here. The assistant tells the customer to re-buy on that marketplace, with a support contact.</span></div>
      <div class="rowline"><span class="path">Expiry</span><span>A warning appears 7 days ahead. After expiry, data is kept and the tools pause until renewal. <span class="mono">/whoami</span> shows plan and expiry.</span></div>
    </div>
    <p class="footer"><span>LICENSES</span><span>03</span></p>`,
  () => `
    <p class="kicker">03  /  THE JIRA FLOW</p>
    <h2 style="font-size:52px">New cards wait in To Do. Dragging one to In Progress starts it.</h2>
    <p class="path" style="font-size:25px;line-height:1.7">To Do → <span style="color:var(--ink)">In Progress</span> → Product Work → BA Question → <span style="color:var(--amber)">Planned ◆</span> → Pre Coding → Coding → QC → <span style="color:var(--amber)">In Review ◆</span> → Done</p>
    <div class="cols c3" style="margin-top:36px">
      <div class="block"><h3>Agents</h3><p>They analyse, ask (BA Question), write the plan, then the tech plan, code and QC. The server checks that each move has its artifact.</p></div>
      <div class="block"><h3 style="color:var(--amber)">◆ Gates</h3><p>The agent stops at Planned and In Review. You approve by moving the card or commenting <span class="mono">/approve</span>. Comments become feedback for the next run.</p></div>
      <div class="block"><h3>Done is yours</h3><p>Only you move a card to Done. The agent posts a closing comment by script, with no model call.</p></div>
    </div>
    <p class="footer"><span>JIRA FLOW</span><span>04</span></p>`,
  () => `
    <p class="kicker">03  /  FLOWS THAT FIT THE WORK</p>
    <h2>Each company has its own flow. Each task has a flow type.</h2>
    <table>
      <thead><tr><th>FLOW TYPE</th><th>STAGES</th><th>USE FOR</th></tr></thead>
      <tbody>
        <tr><td class="mono" style="color:var(--green)">full</td><td>every stage</td><td class="dim">features with real design work</td></tr>
        <tr><td class="mono" style="color:var(--green)">no_plan</td><td>no Planned or Pre Coding</td><td class="dim">clear, small changes</td></tr>
        <tr><td class="mono" style="color:var(--green)">no_dev</td><td>analysis only, no code</td><td class="dim">docs, questions, research</td></tr>
        <tr><td class="mono" style="color:var(--green)">quick</td><td>Coding → QC → In Review</td><td class="dim">tiny obvious fixes</td></tr>
      </tbody>
    </table>
    <p class="dim" style="font-size:24px;margin-top:26px"><span class="mono" style="color:var(--green)">/flow edit</span> designs custom columns, gates, on-enter actions (open_pr, merge into develop) and branch names. <span class="mono" style="color:var(--green)">/flow KAN-7 quick</span> or an <span class="mono">ah-flow:</span> label changes a task's flow mid-work, and the card is remapped with a notice.</p>
    <p class="footer"><span>FLOWS</span><span>05</span></p>`,
  () => `
    <p class="kicker">03  /  COMMANDS</p>
    <h2>Work starts from a sentence and ends in a PR, if you want one.</h2>
    <div class="launch"><p class="cmd">/new-task add a reset button to the counter</p><p>Staff writes a proper Jira issue in To Do. It starts when you drag it.</p></div>
    <div class="launch"><p class="cmd">/split KAN-12</p><p>Splits a big issue into sub-tasks in To Do, each with its own flow.</p></div>
    <div class="launch"><p class="cmd">/auto-pr on</p><p>Off by default, set per company. When on, In Review pushes the branch and opens a PR with <span class="mono">gh</span>, and merge stages run <span class="mono">gh pr merge</span>. It never forces a merge. When off, branches stay local.</p></div>
    <div class="launch"><p class="cmd">/usage  ·  /tasks  ·  /plan KAN-1  ·  /approve KAN-1</p><p>Tokens per task and stage, open tasks, plans and approvals, all from your agent.</p></div>
    <p class="footer"><span>COMMANDS</span><span>06</span></p>`,
  () => `
    <p class="kicker">04  /  SETUP</p>
    <h2 style="font-size:52px">One command, then a checklist that ticks itself.</h2>
    <div class="steps">
      <div class="step"><b>1  /connect-jira KAN</b><span>Reads the board with your Atlassian MCP, then opens a setup page with columns, links and live status.</span></div>
      <div class="step"><b>2  Webhook</b><span>Use the URL from the setup page (it has <span class="mono">?s=…&amp;token=…</span>). JQL <span class="mono">project = KAN</span>. Events: issue created and updated, comment created.</span></div>
      <div class="step"><b>3  Keychain token</b><span><span class="mono">scripts/jira-keychain-setup.sh &lt;site&gt; &lt;email&gt;</span> takes the API token at a hidden prompt and keeps it only in the macOS Keychain.</span></div>
      <div class="step"><b>4  Columns</b><span>The script creates missing statuses. Then drag the columns into order with Done last, because Jira has no API to reorder them.</span></div>
    </div>
    <div class="term" style="margin-top:34px">
      <div class="term-bar"><span class="dot" style="background:#e06a5c"></span><span class="dot" style="background:#e7b15a"></span><span class="dot" style="background:#8fce62"></span><span>agents-holding-server — zsh</span></div>
      <div class="term-body">
        <div><span class="ps">$</span> scripts/holding listener on --repo ~/Code/shop <span class="dimline">  # start now</span></div>
        <div><span class="ps">$</span> scripts/holding listener autostart on <span class="dimline">          # also at login</span></div>
        <div><span class="ps">$</span> scripts/holding listener off <span class="dimline">                    # stop now and turn off autostart</span></div>
        <div><span class="ps">$</span> scripts/holding doctor <span class="dimline">                          # or /doctor: checks every step</span></div>
      </div>
    </div>
    <p class="footer"><span>SETUP · SAMPLE VALUES</span><span>07</span></p>`,
  () => `
    <p class="kicker">04  /  TOKENS  ·  MEASURED ON KAN-1</p>
    <h2 style="font-size:52px">Same task, input tokens. The lean flow costs less than a direct prompt.</h2>
    <table>
      <thead><tr><th>HOW KAN-1 WAS DONE</th><th>INPUT TOKENS</th><th>VS DIRECT</th></tr></thead>
      <tbody>
        <tr><td>Direct prompt (one chat)</td><td class="n">190,842</td><td class="n">1.00×</td></tr>
        <tr><td>Jira flow, before optimization</td><td class="n">3,022,094</td><td class="n">15.8×</td></tr>
        <tr><td>Jira flow, first optimization</td><td class="n">776,973</td><td class="n">4.07×</td></tr>
        <tr><td>Lean Jira flow (today)</td><td class="n win">112,693</td><td class="n win">0.59×</td></tr>
      </tbody>
    </table>
    <p class="dim" style="font-size:23px;margin-top:22px">The lean flow uses scripts for Jira, git and comments, a cheap model for the plan stage, and one coding call with no MCP servers attached. Done, moves and merges make no model call.</p>
    <p class="note" style="bottom:70px;font-size:18px">Measured on one sample task (KAN-1), so results on other tasks will vary.</p>
    <p class="footer"><span>TOKEN COMPARISON</span><span>08</span></p>`,
  () => `
    <p class="kicker">END</p>
    <p class="giant">Drag a card.<br>Approve the plan.<br>Review the branch.</p>
    <p class="lead dim">The server keeps the flow. Scripts do the busywork. The model only does the thinking.</p>
    <p class="footer"><span>AGENTS HOLDING</span><span>09</span></p>`
];

const stage = document.getElementById("stage");
slides.forEach((fn) => {
  const el = document.createElement("section");
  el.className = "slide";
  el.innerHTML = fn();
  stage.appendChild(el);
});
let i = 0;
function fit() {
  const s = Math.min(innerWidth / 1600, innerHeight / 900);
  stage.style.setProperty("--s", String(s));
}
function show(n) {
  i = (n + slides.length) % slides.length;
  [...stage.children].forEach((el, k) => el.classList.toggle("on", k === i));
  stage.style.setProperty("--p", ((i + 1) / slides.length * 100) + "%");
  history.replaceState(null, "", "#" + (i + 1));
}
addEventListener("resize", fit);
addEventListener("keydown", (e) => {
  if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) { e.preventDefault(); show(i + 1); }
  else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); show(i - 1); }
  else if (e.key === "Home") show(0);
  else if (e.key === "End") show(slides.length - 1);
  else if (e.key === "f") document.documentElement.requestFullscreen?.();
});
addEventListener("click", (e) => {
  if (e.clientX > innerWidth * 0.72) show(i + 1);
  else if (e.clientX < innerWidth * 0.28) show(i - 1);
});
addEventListener("hashchange", () => {
  const n = parseInt(location.hash.slice(1), 10);
  if (Number.isFinite(n)) show(n - 1);
});
if (/all/.test(location.search + location.hash)) { document.body.classList.add("all"); [...stage.children].forEach((el) => el.classList.add("on")); } else {
fit();
const start = parseInt(location.hash.slice(1), 10);
show(Number.isFinite(start) ? start - 1 : 0);
}
</script>
</body>
</html>
