<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents Holding</title>
<style>
  :root {
    --bg: #070b0a;
    --stage: #101614;
    --ink: #f4f0e6;
    --dim: #9aa398;
    --mute: #6d756c;
    --green: #c6f26d;
    --amber: #e7a15a;
    --line: rgba(244,240,230,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body { font-family: "Avenir Next", "Segoe UI", sans-serif; overflow: hidden; }
  .stage {
    position: absolute;
    left: 50%; top: 50%;
    width: 1600px; height: 900px;
    transform: translate(-50%, -50%) scale(var(--s, 1));
    background: var(--stage);
    overflow: hidden;
  }
  .stage::before {
    content: "";
    position: absolute; left: 0; top: 0; height: 8px; width: var(--p, 0%);
    background: var(--green); z-index: 2;
  }
  .slide { display: none; height: 100%; padding: 72px 88px 88px; position: relative; }
  .slide.on { display: block; }
  .kicker {
    font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    font-size: 18px; letter-spacing: .18em; color: var(--green); margin: 0 0 28px;
  }
  h1 {
    font-family: Georgia, "Iowan Old Style", serif;
    font-weight: 400; font-size: 108px; line-height: .95; margin: 0; letter-spacing: -1px;
  }
  h2 {
    font-family: Georgia, "Iowan Old Style", serif;
    font-weight: 400; font-size: 64px; line-height: 1.05; margin: 0 0 36px; max-width: 1300px;
  }
  .lead { font-size: 34px; line-height: 1.35; max-width: 1100px; margin: 36px 0 0; color: var(--ink); }
  .dim { color: var(--dim); }
  .mono { font-family: ui-monospace, Consolas, monospace; }
  .footer {
    position: absolute; left: 88px; right: 88px; bottom: 36px;
    display: flex; justify-content: space-between;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 16px; letter-spacing: .08em; color: var(--mute);
  }
  .rule { height: 1px; background: var(--line); margin: 28px 0; }
  .cols { display: grid; gap: 28px; }
  .c3 { grid-template-columns: 1fr 1fr 1fr; }
  .c2 { grid-template-columns: 1fr 1fr; }
  .block h3 { margin: 0 0 12px; font-size: 28px; font-weight: 600; }
  .block p { margin: 0; font-size: 24px; line-height: 1.4; color: var(--dim); }
  .idx { font-family: Georgia, serif; font-size: 42px; color: var(--green); display: block; margin-bottom: 12px; }
  .stat { font-family: Georgia, serif; font-size: 92px; line-height: .9; margin: 0; }
  .bench { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 64px; margin-top: 56px; }
  .bench-k { margin: 28px 0 0; font-size: 22px; letter-spacing: .16em; text-transform: uppercase; color: var(--green); }
  .bench-n { margin: 14px 0 0; font-family: Georgia, serif; font-size: 44px; line-height: 1.1; color: var(--ink); }
  .bench-vs { margin: 8px 0 0; font-size: 32px; line-height: 1.25; color: var(--ink); }
  table { width: 100%; border-collapse: collapse; font-size: 28px; }
  th { text-align: left; font-weight: 500; color: var(--mute); font-size: 16px; letter-spacing: .14em; padding: 0 0 16px; }
  td { padding: 18px 16px 18px 0; border-top: 1px solid var(--line); vertical-align: baseline; }
  td.n { font-family: Georgia, serif; font-size: 34px; }
  td.win { color: var(--green); }
  .cmd {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 26px; color: var(--green); margin: 0 0 8px;
  }
  .launch { margin: 0 0 22px; }
  .launch .cmd { font-size: 30px; margin: 0 0 6px; }
  .launch p { margin: 0; font-size: 26px; color: var(--ink); }
  .term {
    margin-top: 18px; background: #07110e; border: 1px solid #2c3a32; border-radius: 12px;
    overflow: hidden; font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .term-bar {
    display: flex; gap: 8px; align-items: center; padding: 12px 16px;
    background: #121c18; color: var(--mute); font-size: 16px;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .term-body { padding: 18px 22px 22px; font-size: 22px; line-height: 1.45; }
  .term-body .ps { color: var(--green); }
  .term-body .dimline { color: var(--dim); }
  .pick { color: var(--ink); }
  .pick.on { background: #e8f5d8; color: #10210c; display: block; margin: 0 -8px; padding: 0 8px; }
  .path { font-family: ui-monospace, Consolas, monospace; font-size: 26px; color: var(--green); }
  .rowline { display: grid; grid-template-columns: 340px 1fr; gap: 24px; padding: 16px 0; border-top: 1px solid var(--line); font-size: 26px; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; margin-top: 20px; }
  .step { border-top: 3px solid var(--green); padding-top: 18px; }
  .step b { display: block; font-size: 26px; margin-bottom: 10px; }
  .step span { color: var(--dim); font-size: 22px; line-height: 1.35; display: block; }
  .giant { font-family: Georgia, serif; font-size: 78px; line-height: 1.05; margin: 80px 0 0; }
  .agenda { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 56px; margin-top: 28px; }
  .agenda div { border-top: 2px solid var(--green); padding-top: 12px; }
  .agenda b { display: block; font-size: 28px; font-weight: 600; margin-bottom: 4px; }
  .agenda span { display: block; font-size: 22px; color: var(--dim); }
  .note { position: absolute; left: 88px; right: 88px; bottom: 86px; color: var(--mute); font-size: 20px; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>

const stage = document.getElementById("stage");
slides.forEach((fn) => {
  const el = document.createElement("section");
  el.className = "slide";
  el.innerHTML = fn();
  stage.appendChild(el);
});
let i = 0;
function fit() {
  const s = Math.min(innerWidth / 1600, innerHeight / 900);
  stage.style.setProperty("--s", String(s));
}
function show(n) {
  i = (n + slides.length) % slides.length;
  [...stage.children].forEach((el, k) => el.classList.toggle("on", k === i));
  stage.style.setProperty("--p", ((i + 1) / slides.length * 100) + "%");
  history.replaceState(null, "", "#" + (i + 1));
}
addEventListener("resize", fit);
addEventListener("keydown", (e) => {
  if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) { e.preventDefault(); show(i + 1); }
  else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); show(i - 1); }
  else if (e.key === "Home") show(0);
  else if (e.key === "End") show(slides.length - 1);
  else if (e.key === "f") document.documentElement.requestFullscreen?.();
});
addEventListener("click", (e) => {
  if (e.clientX > innerWidth * 0.72) show(i + 1);
  else if (e.clientX < innerWidth * 0.28) show(i - 1);
});
addEventListener("hashchange", () => {
  const n = parseInt(location.hash.slice(1), 10);
  if (Number.isFinite(n)) show(n - 1);
});
fit();
const start = parseInt(location.hash.slice(1), 10);
show(Number.isFinite(start) ? start - 1 : 0);
</script>
